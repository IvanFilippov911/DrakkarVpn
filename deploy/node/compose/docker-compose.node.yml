version: "3.9"

name: drakkar-node

services:
  xray:
  image: ghcr.io/xtls/xray-core:latest
  container_name: drakkar-xray
  restart: unless-stopped

  ports:
    - "443:443/tcp"

  volumes:
    - ../configs/xray/config.json:/etc/xray/config.json:ro
    - xray-logs:/var/log/xray

  command: ["run", "-c", "/etc/xray/config.json"]

  networks:
    - drakkar-node-net

  agent:
    image: ${AGENT_IMAGE}:${AGENT_TAG}
    container_name: drakkar-agent
    restart: unless-stopped

    depends_on:
      - xray

    env_file:
      - ../env/node.env

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000

    ports:
      - "${AGENT_HOST_BIND:-127.0.0.1}:5000:5000"

    networks:
      - drakkar-node-net

networks:
  drakkar-node-net:
    driver: bridge

volumes:
  xray-logs: