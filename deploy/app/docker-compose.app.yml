services:
  user-api:
    build:
      context: ../..
      dockerfile: hosts/DrakkarVpn.User.Api/Dockerfile
    container_name: drakkar-user-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Db: Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__Token: ${TELEGRAM_BOT_TOKEN}
    volumes:
      - ../../runtime/logs:/var/log/drakkar
    networks:
      - drakkar-net
    depends_on:
      - db-migrator

  admin-api:
    build:
      context: ../..
      dockerfile: hosts/DrakkarVpn.Admin.Api/Dockerfile
    container_name: drakkar-admin-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Db: Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: ${REDIS_HOST}:${REDIS_PORT}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      AdminJwt__SigningKey: ${ADMIN_JWT_SIGNING_KEY}
      AdminJwt__Issuer: ${ADMIN_JWT_ISSUER}
      AdminJwt__Audience: ${ADMIN_JWT_AUDIENCE}
      AdminJwt__AccessTokenTtlMinutes: ${ADMIN_JWT_ACCESS_TOKEN_TTL_MINUTES}
    volumes:
      - ../../runtime/logs:/var/log/drakkar
    networks:
      - drakkar-net
    depends_on:
      - db-migrator

  db-migrator:
    build:
      context: ../..
      dockerfile: hosts/DrakkarVpn.DbMigrator/Dockerfile
    container_name: drakkar-db-migrator
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Db: Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    networks:
      - drakkar-net

  bot:
    build:
      context: ../..
      dockerfile: hosts/DrakkarVpn.Bot/Dockerfile
    container_name: drakkar-bot
    restart: always
    environment:
      Telegram__Token: ${TELEGRAM_BOT_TOKEN}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      WebApp__BaseUrl: ${WEBAPP_BASE_URL}
      UserFlowApi__BaseUrl: ${USER_API_INTERNAL_URL}
    volumes:
      - ../../runtime/logs:/var/log/drakkar
    networks:
      - drakkar-net

  user-ui:
    build:
      context: ../../frontend/drakkar-vpn-user-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: drakkar-user-ui
    restart: always
    networks:
      - drakkar-net

  admin-ui:
    build:
      context: ../../frontend/drakkar-vpn-admin-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: drakkar-admin-ui
    restart: always
    networks:
      - drakkar-net

  nginx:
    image: nginx:alpine
    container_name: drakkar-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      - user-ui
      - admin-ui
      - user-api
      - admin-api
    networks:
      - drakkar-net

networks:
  drakkar-net:
    external: true