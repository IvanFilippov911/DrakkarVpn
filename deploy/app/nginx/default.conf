upstream drakkar_webapp {
    server webapp:80;
}

upstream drakkar_core_api {
    server core-api:8080;
}

upstream drakkar_admin_api {
    server admin-api:8080;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name app.drakkar-network.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.drakkar-network.com;

    ssl_certificate /etc/letsencrypt/live/app.drakkar-network.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.drakkar-network.com/privkey.pem;

    location / {
        proxy_pass http://drakkar_webapp;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.drakkar-network.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.drakkar-network.com;

    ssl_certificate /etc/letsencrypt/live/api.drakkar-network.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.drakkar-network.com/privkey.pem;

    location / {
        proxy_pass http://drakkar_core_api;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.drakkar-network.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.drakkar-network.com;

    ssl_certificate /etc/letsencrypt/live/admin.drakkar-network.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.drakkar-network.com/privkey.pem;

    location / {
        proxy_pass http://drakkar_admin_api;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}