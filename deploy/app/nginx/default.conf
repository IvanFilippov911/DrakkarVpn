upstream drakkar_user_ui {
    server drakkar-user-ui:80;
}

upstream drakkar_admin_ui {
    server drakkar-admin-ui:80;
}

upstream drakkar_user_api {
    server drakkar-user-api:8080;
}

upstream drakkar_admin_api {
    server drakkar-admin-api:8080;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name drakkarnetwork.com www.drakkarnetwork.com app.drakkarnetwork.com admin.drakkarnetwork.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name drakkarnetwork.com www.drakkarnetwork.com app.drakkarnetwork.com;

    ssl_certificate /etc/letsencrypt/live/drakkarnetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drakkarnetwork.com/privkey.pem;

    location /api/ {
        proxy_pass http://drakkar_user_api;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://drakkar_user_ui;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.drakkarnetwork.com;

    ssl_certificate /etc/letsencrypt/live/drakkarnetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drakkarnetwork.com/privkey.pem;

    location /api/ {
        proxy_pass http://drakkar_admin_api;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://drakkar_admin_ui;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}