version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: drakkar-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - drakkar-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: drakkar-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - postgres
    networks:
      - drakkar-net

  redis:
    image: redis:7
    container_name: drakkar-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - drakkar-net

volumes:
  db-data:
  redis-data:

networks:
  drakkar-net:
    external: true